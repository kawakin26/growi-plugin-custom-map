name: Build Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/docs-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: ['ja', 'en']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'docs/requirements.txt'

      - name: Install dependencies
        run: |
          pip install -r docs/requirements.txt

      - name: Build HTML documentation (${{ matrix.language }})
        run: |
          cd docs
          make html LANG_DIR=${{ matrix.language }}

      - name: Build Markdown documentation (${{ matrix.language }})
        run: |
          cd docs
          make markdown LANG_DIR=${{ matrix.language }}

      - name: Upload artifacts (${{ matrix.language }})
        uses: actions/upload-artifact@v4
        with:
          name: docs-${{ matrix.language }}
          path: |
            docs/${{ matrix.language }}/_build/html
            docs/${{ matrix.language }}/_build/markdown
          retention-days: 30

      - name: Check build success
        run: |
          echo "✓ Documentation build successful for ${{ matrix.language }}"
          ls -lh docs/${{ matrix.language }}/_build/

  comment-pr:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Documentation builds completed successfully for both Japanese and English versions.'
            })
